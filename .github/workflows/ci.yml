name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgres-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGSCOPE_TEST_DSN: postgresql://pgscope_reader:pgscope_demo_readonly@127.0.0.1:55432/pgscope_demo
      PGSCOPE_DSN: postgresql://pgscope_reader:pgscope_demo_readonly@127.0.0.1:55432/pgscope_demo
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: docker compose up -d --wait
      - run: uv run --frozen ruff check src tests scripts
      - run: uv run --frozen ruff format --check src tests scripts
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python -m scripts.smoke_mcp --output-json artifacts/ci-mcp.json
      - name: Reproduce both benchmark experiments
        env:
          PGSCOPE_DEMO_ADMIN_DSN: postgresql://postgres:pgscope_demo_admin@127.0.0.1:55432/pgscope_demo
        run: uv run --frozen python -m scripts.benchmark --output-dir artifacts/ci-benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: postgres-evidence
          path: artifacts/ci-*
      - name: PostgreSQL diagnostics on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop demo container
        if: always()
        run: docker compose down

  windows-unit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q -m "not integration"
